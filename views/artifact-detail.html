<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Artifact Detail</title>
    <link rel="stylesheet" href="/css/artifact-detail.css" />
    <link rel="stylesheet" href="/css/artifactChat.css" />
  </head>
  <body>
    <!-- <div id="page-content" style="display: none"> -->
    <div id="detail-container">
      <!-- Left image section -->
      <div id="detail-image">
        <!-- JS will inject the main artifact image here -->
        <div id="pip-container">
          <img id="pip-img" src="" alt="Zoom View" />
        </div>
      </div>

      <!-- Right info section -->
      <div id="detail-info">
        <!-- JS will inject artifact title, price, description here -->
      </div>
    </div>

    <!-- Zoom modal -->
    <div id="zoom-modal">
      <span id="zoom-close">&times;</span>
      <img id="zoom-img" src="" alt="" />
    </div>
    <!-- </div> -->

    <script src="/js/artifact-detail.js"></script>
  </body>
</html>
